name: User Service CI/CD Pipeline

on:
  push:
    branches: main  
  pull_request:
    branches: main

jobs:
  test:
    runs-on: ubuntu-latest
    container: 
      image: gradle:7.6-jdk17

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: ${{secrets.POSTGRES_DB || 'user_db_test'}}
          POSTGRES_USER: ${{secrets.POSTGRES_USER || 'user_admin'}}
          POSTGRES_PASSWORD: ${{secrets.POSTGRES_PASSWORD || 'user_secret_pass'}}
        ports:
          - "5432:5432"
        options:
          --health-cmd pg_isready
          --health-intetval 10s
          --health-timeout 5s
          --health-retries 5
    
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${{secrets.POSTGRES_DB || 'user_db_test'}}
      SPRING_DATASOURCE_USERNAME: ${{secrets.POSTGRES_USER || 'user_admin'}}
      SPRING_DATASOURCE_PASSWORD: ${{secrets.POSTGRES_PASSWORD || 'user_secret_pass'}}
  
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Intergration Tests
        run: ./gradlew test
    
  build:
    runs-on: ubuntu-latest
    needs: test
    container:
      image: gradle:7.6-jdk17

    steps:
      - name: Checkout source code 
        uses: actions/checkout@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Application (.jar)
        run: ./gradlew build -x test

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 1

  dockerize:
    runs-on: ubuntu-latest
    needs: build
    steps:  
      - name: Checkout source code
        uses: actions/checkout@v4
      
      - name: Set Short Commit SHA
        id: vars
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/user-service:${{ env.SHORT_SHA }}${{ secrets.DOCKER_USERNAME }}/user-service:latest

